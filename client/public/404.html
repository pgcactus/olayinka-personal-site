<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Olayinka Titilola</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #171717;
        --muted: #5a5a5a;
        --highlight: #e0f2fe;
        --highlight-hover: #bae6fd;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: #fff;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 14px;
        line-height: 1.75;
      }
      main {
        width: min(100% - 48px, 640px);
        margin: 0 auto;
        padding: 96px 0;
      }
      h1, p { margin: 0; }
      h1 {
        color: var(--ink);
        font-size: 14px;
        line-height: 1.75;
        font-weight: 700;
      }
      p + p { margin-top: 24px; }
      a {
        display: inline-block;
        color: var(--ink);
        background: var(--highlight);
        padding: 1px 6px;
        text-decoration: none;
      }
      a:hover { background: var(--highlight-hover); }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (max-width: 639px) {
        main { width: min(100% - 48px, 640px); padding: 80px 0 96px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found.</h1>
      <p>The link is broken or the page has moved.</p>
      <p><a href="/">&#8592; back home</a></p>
    </main>
  </body>
</html>
